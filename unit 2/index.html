<!DOCTYPE html>
<html>
<head>
    <title>Directory Listing</title>
</head>
<body>
    <ul id="file-list"></ul>
    <script>
        const user = 'anilvce';
        const repo = 'dsur26';

        // Get the current path from the URL
        // e.g., "/dsur26/unit%202/" → "unit 2/"
        const currentPath = window.location.pathname
            .replace(`/${repo}/`, '')  // remove the repo name
            .replace(/^\/+/, '');       // remove leading slash

        async function listDirectory() {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${currentPath}`;
            const response = await fetch(url);
            const files = await response.json();

            const list = document.getElementById('file-list');
            list.innerHTML = '';  // clear old content

            // Add a "Parent Directory" link if not in root
            if (currentPath) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '..';
                a.textContent = '.. (Parent Directory)';
                li.appendChild(a);
                list.appendChild(li);
            }

            files.forEach(file => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                // Use the filename only, not the full path
                a.href = file.name;
                a.textContent = file.name;
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        listDirectory();
    </script>
</body>
</html>
