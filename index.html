<!DOCTYPE html>
<html>
<head>
    <title>Directory Listing</title>
</head>
<body>
    <ul id="file-list"></ul>
    <script>
        const user = 'anilvce';
        const repo = 'dsur26';

        // Path now comes from the URL hash instead of the real pathname,
        // e.g. https://anilvce.github.io/dsur26/#unit%202/
        // This way every "navigation" stays on this same index.html file,
        // which is required because GitHub Pages has no real index.html
        // inside each subfolder (it can't run this script otherwise).
        function getCurrentPath() {
            let hash = window.location.hash.replace(/^#/, '');
            hash = hash.replace(/^\/+/, ''); // strip any leading slash
            return hash; // still URL-encoded, e.g. "unit%202/"
        }

        async function listDirectory() {
            const currentPath = getCurrentPath();

            // Encode each path segment separately (so real "/" separators survive)
            const encodedPath = currentPath
                .split('/')
                .filter(Boolean)
                .map(decodeURIComponent) // normalize in case it's already encoded
                .map(encodeURIComponent)
                .join('/');

            const url = `https://api.github.com/repos/${user}/${repo}/contents/${encodedPath}`;
            const response = await fetch(url);
            const files = await response.json();

            const list = document.getElementById('file-list');
            list.innerHTML = '';

            if (!Array.isArray(files)) {
                const li = document.createElement('li');
                li.textContent = files.message || 'Error loading directory';
                list.appendChild(li);
                return;
            }

            // Parent directory link
            if (encodedPath) {
                const parts = encodedPath.split('/').filter(Boolean);
                parts.pop();
                const parentPath = parts.join('/');

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = parentPath ? `#${parentPath}/` : '#';
                a.textContent = '.. (Parent Directory)';
                li.appendChild(a);
                list.appendChild(li);
            }

            files.forEach(file => {
                const li = document.createElement('li');
                const a = document.createElement('a');

                if (file.type === 'dir') {
                    // Stay on this page, just change the hash
                    a.href = `#${encodedPath ? encodedPath + '/' : ''}${encodeURIComponent(file.name)}/`;
                } else {
                    // Link to the file on GitHub Pages (not raw.githubusercontent.com).
                    // raw.githubusercontent.com always serves as text/plain, so .html
                    // files show as source code instead of rendering. The Pages URL
                    // serves the real content-type and renders HTML normally.
                    const filePath = `${encodedPath ? encodedPath + '/' : ''}${encodeURIComponent(file.name)}`;
                    a.href = `https://${user}.github.io/${repo}/${filePath}`;
                }

                a.textContent = file.name;
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        // Re-run whenever the hash changes (i.e. whenever the user "navigates")
        window.addEventListener('hashchange', listDirectory);
        listDirectory();
    </script>
</body>
</html>
